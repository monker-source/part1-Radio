      function FxGroup({ group, hidden, onHide, children }) {
        const [mounted, setMounted] = useState(!hidden);
        const [open, setOpen] = useState(!hidden);
        const firstPaint = useRef(true);

        useEffect(() => {
          if (firstPaint.current) {
            firstPaint.current = false;
            return;
          }
          if (!hidden) {
            setMounted(true);
            setOpen(false);
            const id = requestAnimationFrame(() => setOpen(true));
            return () => cancelAnimationFrame(id);
          }
          setOpen(false);
          // grid-template-rows often skips transitionend — always unmount after the ease.
          const t = window.setTimeout(() => setMounted(false), 360);
          return () => window.clearTimeout(t);
        }, [hidden]);

        if (!mounted) return null;

        return (
          <section
            className={`fx-group${open ? " is-open" : ""}`}
            aria-hidden={!open}
          >
            <div className="fx-group-clip">
              <div className="fx-group-head">
                <h3>{group.title}</h3>
                <button
                  type="button"
                  className="fx-group-hide"
                  onClick={onHide}
                  title={`Hide ${group.title} group`}
                >
                  Hide
                </button>
              </div>
              <div className="fx-group-body">{children}</div>
            </div>
          </section>
        );
      }

      function TimeField({ seconds, duration, onSeek }) {
        const [text, setText] = useState(() => formatTime(seconds));
        const [focused, setFocused] = useState(false);

        useEffect(() => {
          if (!focused) setText(formatTime(seconds));
        }, [seconds, focused]);

        const commit = (raw) => {
          const parsed = parseTimeInput(raw);
          if (!Number.isFinite(parsed)) {
            setText(formatTime(seconds));
            return;
          }
          const next = clamp(parsed, 0, duration);
          onSeek(next);
          setText(formatTime(next));
        };

        return (
          <input
            className="time-input"
            type="text"
            inputMode="decimal"
            aria-label="Current time"
            title="Type a time (mm:ss.t or seconds) and press Enter"
            value={focused ? text : formatTime(seconds)}
            onClick={(e) => e.stopPropagation()}
            onPointerDown={(e) => e.stopPropagation()}
            onFocus={(e) => {
              setFocused(true);
              setText(formatTime(seconds));
              e.target.select();
            }}
            onChange={(e) => setText(e.target.value)}
            onBlur={() => {
              setFocused(false);
              commit(text);
            }}
            onKeyDown={(e) => {
              if (e.key === "Enter") {
                e.preventDefault();
                e.currentTarget.blur();
              } else if (e.key === "Escape") {
                setText(formatTime(seconds));
                e.currentTarget.blur();
              }
            }}
          />
        );
      }

      function buildWorkletFx(fx, chaos, duration, cutSeed) {
        const wow = fx.wowFlutter;
        const pt = fx.pitchTimeDecouple;
        const loop = fx.loopFragment;
        const glitch = fx.glitchDegrade;
        const rev = fx.reverse;
        const collage = fx.layeredCollage;
        const band = fx.bandIsolation;
        const lpf = fx.modulatedLowpass;
        const verb = fx.longReverb;
        const cutUp = loop.enabled && isCutUpMode(loop.mode);
        const looping = loop.enabled && !cutUp;

        const layers = [];
        if (collage.enabled) {
          const defs = [
            { delaySec: collage.layer1Delay, speedFactor: collage.layer1Speed, gain: collage.layer1Gain },
            { delaySec: collage.layer2Delay, speedFactor: collage.layer2Speed, gain: collage.layer2Gain },
            { delaySec: collage.layer3Delay, speedFactor: collage.layer3Speed, gain: collage.layer3Gain },
            { delaySec: collage.layer3Delay * 1.4, speedFactor: 0.97, gain: collage.layer3Gain * 0.7 },
          ];
          for (let i = 0; i < collage.layerCount - 1; i += 1) layers.push(defs[i]);
        }

        const map = cutUp
          ? buildCutMap(duration, loop.durationSec, loop.mode, cutSeed)
          : [];

        const speedFactor = scaleWithChaos(
          clamp((pt.speedPercent ?? 100) / 100, 0.1, 4),
          chaos,
          "speed"
        );

        return {
          wowFlutter: {
            enabled: wow.enabled,
            depth: scaleWithChaos(wow.depth, chaos, "depth"),
            rateHz: scaleWithChaos(wow.rateHz, chaos, "rate"),
            flutterDepth: scaleWithChaos(wow.flutterDepth, chaos, "depth"),
            flutterRateHz: scaleWithChaos(wow.flutterRateHz, chaos, "rate"),
          },
          pitchTime: {
            enabled: pt.enabled,
            speedFactor,
            pitchSemitones: scaleWithChaos(pt.pitchSemitones, chaos, "semitone"),
          },
          loop: {
            enabled: looping,
            startSec: loop.startSec,
            durationSec: loop.durationSec,
            driftMode: loop.mode,
          },
          cutUp: {
            enabled: cutUp,
            map,
            xfadeSec: 0.012,
            glitchClicks: loop.glitchClicks,
          },
          glitch: {
            enabled: glitch.enabled,
            intensity: scaleWithChaos(glitch.intensity, chaos, "intensity"),
            triggerMode: glitch.triggerMode,
          },
          reverse: {
            enabled: rev.enabled,
            scope: rev.scope,
            segmentStart: rev.segmentStart,
            segmentEnd: Math.max(rev.segmentStart + 0.05, rev.segmentEnd),
          },
          // #region agent log
          __dbgBuildReverse: {
            enabled: rev.enabled,
            scope: rev.scope,
            segmentStart: rev.segmentStart,
            segmentEnd: Math.max(rev.segmentStart + 0.05, rev.segmentEnd),
            rawEnd: rev.segmentEnd,
          },
          // #endregion
          collage: {
            enabled: collage.enabled,
            layers,
          },
          bandIsolation: {
            enabled: band.enabled,
            keep: band.keep,
            highpassHz: band.highpassHz,
            lowpassHz: band.lowpassHz,
            transientSoft: scaleWithChaos(band.transientSoft, chaos, "intensity"),
          },
          modulatedLowpass: {
            enabled: lpf.enabled,
            cutoffHz: lpf.cutoffHz,
            lfoPeriodSec: lpf.lfoPeriodSec,
            lfoDepth: scaleWithChaos(lpf.lfoDepth, chaos, "intensity"),
            resonance: lpf.resonance,
          },
          longReverb: {
            enabled: verb.enabled,
            decaySec: verb.decaySec * (1 + chaos * 0.6),
            wet: clamp(verb.wet * (1 + chaos * 0.35), 0, 1),
            damp: verb.damp,
          },
        };
      }

      function Player({ track, onReset }) {
        const canvasRef = useRef(null);
        const deckRef = useRef(null);
        const positionRef = useRef(0);
        const playingRef = useRef(false);
        const scrubbingRef = useRef(false);
        const gestureRef = useRef(null);
        const ignoreNextClickRef = useRef(false);
        const rafRef = useRef(0);
        const fxRef = useRef(DEFAULT_FX);
        const chaosRef = useRef(0);
        const cutSeedRef = useRef(1);
        const stochasticMemoryRef = useRef({});
        const loopRegionRef = useRef(null);

        const [playing, setPlaying] = useState(false);
        const [scrubbing, setScrubbing] = useState(false);
        const [position, setPosition] = useState(0);
        const [volume, setVolume] = useState(0.8);

          };
          rafRef.current = requestAnimationFrame(render);
          return () => cancelAnimationFrame(rafRef.current);
        }, [track]);

        useEffect(() => () => {
          track.engine.node.port.postMessage({ type: "pause" });
          track.engine.node.disconnect();
        }, [track]);

        return (
          <div className={`shell${playing ? " playing" : ""}`}>
          <main className="player" onClick={handlePlayerClick}>
              <div className="playhead" aria-hidden="true" />
              <div className="player-top">
                <button
                  className="track-switch"
                  onClick={(event) => {
                    event.stopPropagation();
                    onReset();
                  }}
                >
                  <span className="track-label">{track.name}</span>
                  <span className="change-label">Change track</span>
                </button>
                <button
                  type="button"
                  className="download-button"
                  onClick={downloadModified}
                  disabled={downloading}
                  title="Render current effects to a WAV file"
                >
                  {downloading ? "Rendering…" : "Download"}
                </button>
              </div>

            <section
              ref={deckRef}
              className={`deck ${scrubbing ? "scrubbing" : ""}`}
              onPointerDown={beginScrub}
              onPointerMove={moveScrub}
              onPointerUp={endScrub}
              onPointerCancel={endScrub}
              aria-label="Drag horizontally to scrub the audio"
            >
              <canvas ref={canvasRef} />
            </section>

            <footer className="controls">
                <div className="transport">
              <button
                    type="button"
                    className="restart-button"
                    onClick={jumpToStart}
                    aria-label="Back to start"
                    title="Back to start"
                  >
                    <span className="restart-icon">⏮</span>
              </button>
              <button
                className={`play-button${playing ? " is-playing" : ""}`}
                onClick={(event) => {
                  event.stopPropagation();
                  togglePlay();
                }}
                aria-label={playing ? "Pause" : "Play"}
              >
                <span className="play-icon" aria-hidden="true">▶</span>
                <span className="pause-icon" aria-hidden="true">Ⅱ</span>
              </button>
                </div>
                <div className="time">
                  <TimeField
                    seconds={position}
                    duration={duration}
                    onSeek={async (next) => {
                      await track.context.resume();
                      const wasPlaying = playingRef.current;
                      if (wasPlaying) pause();
                      seek(next);
                      if (wasPlaying) await play();
                    }}
                  />
                  <span className="time-total">{formatTime(duration)}</span>
                </div>
              <div className="right-controls">
                <label className="volume-control" onClick={(event) => event.stopPropagation()}>
                  <span>Volume</span>
                  <input
                    type="range"
                    min="0"
                    max="1"
                    step="0.01"
                    value={volume}
                    onChange={changeVolume}
                    aria-label="Volume"
                  />
                </label>
              </div>
            </footer>
          </main>

            <EffectsPanel
              fx={fx}
              setFx={setFx}
              chaos={chaos}
              setChaos={setChaos}
              onResetClean={resetClean}
              duration={duration}
              hiddenGroups={hiddenGroups}
              setHiddenGroups={setHiddenGroups}
              collapsedModules={collapsedModules}
              setCollapsedModules={setCollapsedModules}
            />
          </div>
        );
      }

      function App() {
        const [track, setTrack] = useState(null);

        const loadFile = async (file, onProgress) => {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) throw new Error("Web Audio API is not supported in this browser.");
          const context = new AudioContextClass();
          await context.resume();
          try {
            const arrayBuffer = await file.arrayBuffer();
            onProgress(5);
            let buffer;
            try {
              buffer = await decodeAudioBuffer(context, arrayBuffer);
            } catch (decodeErr) {
              throw new Error(
                "Browser could not decode this file (" +
                  (decodeErr && decodeErr.message ? decodeErr.message : "decode failed") +
                  "). Try WAV or MP3."
              );
            }
            onProgress(15);
            const waveform = await makeWaveformStems(buffer, onProgress);
            onProgress(88);
            const masterGain = context.createGain();
            masterGain.gain.value = 0.8 * 0.8;
            masterGain.connect(context.destination);
            const engine = await createWeirdEngine(context, buffer, masterGain);
            onProgress(98);
            setTrack({
              name: file.name.replace(/\.[^/.]+$/, "") || "Untitled",
              buffer,
              context,
              waveform,
              engine,
              masterGain,
            });
          } catch (error) {
            try { await context.close(); } catch {}
            throw error;
          }
        };

        const reset = async () => {
          if (track) {
            try { track.engine.node.disconnect(); } catch {}
            await track.context.close();
          }
          setTrack(null);
        };

        return track
          ? <Player track={track} onReset={reset} />
          : <DropScreen onFile={loadFile} />;
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
